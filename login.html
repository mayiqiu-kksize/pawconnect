<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | PawConnect</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="logo" href="index.html">PawConnect</a>
    <nav class="site-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="browse.html">Browse Pets</a></nav>
  </div></header>
  <main>
    <section class="auth-panel" aria-labelledby="login-title">
      <h1 id="login-title">Log in</h1>
      <p id="login-notice" class="notice" hidden></p>
      <form id="login-form" class="application-form" novalidate>
        <label for="email">Email
          <input id="email" name="email" type="email" autocomplete="username">
        </label>
        <label for="password">Password
          <input id="password" name="password" type="password" autocomplete="current-password">
        </label>
        <p id="login-error" class="form-error" role="alert"></p>
        <button class="button" type="submit">Log in</button>
      </form>
      <details class="demo-accounts">
        <summary>Demo accounts for testing</summary>
        <p>This is a prototype. Accounts are stored in this browser only.</p>
        <ul>
          <li>Adopter: <code>emily@pawconnect.test</code> / <code>Adopt1234</code></li>
          <li>Shelter staff: <code>sarah@harbourpaws.test</code> / <code>Staff1234</code></li>
        </ul>
      </details>
    </section>
  </main>
  <footer class="site-footer"><div class="footer-inner">PawConnect prototype – Team 10</div></footer>
  <script src="auth.js"></script>
  <script>
    (function () {
      var current = PawAuth.getCurrentUser();
      if (current) {
        window.location.replace(PawAuth.landingPage(current));
        return;
      }

      var notices = {
        'logged-out': 'You have been logged out.',
        'login-required': 'Please log in to continue.'
      };
      var reason = new URLSearchParams(window.location.search).get('reason');
      var notice = document.getElementById('login-notice');
      if (notices[reason]) {
        notice.textContent = notices[reason];
        notice.hidden = false;
      }

      var form = document.getElementById('login-form');
      var error = document.getElementById('login-error');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        error.textContent = '';
        var email = form.elements.email.value;
        var password = form.elements.password.value;
        if (!email.trim() || !password) {
          error.textContent = 'Please enter your email and password.';
          return;
        }
        var user = PawAuth.login(email, password);
        if (!user) {
          error.textContent = 'Email or password is incorrect.';
          form.elements.password.value = '';
          return;
        }
        window.location.href = PawAuth.landingPage(user);
      });
    }());
  </script>
</body>
</html>
